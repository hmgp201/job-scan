name: Job scan

on:
  schedule:
    # GitHub Actions cron is best-effort and can lag a few minutes under load,
    # but this is the schedule requested: every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Never run two scans at once — they'd both read the same pre-scan ledger
# and could double-alert Telegram, and both would try to push state commits.
concurrency:
  group: job-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs configs/default/config.json, whose telegram.botTokenEnv/chatIdEnv
      # name TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID (see that file). This is a
      # one-shot notifier — it only sends Telegram messages, there's no
      # process left running to receive replies. --discover is always on here
      # so every scheduled run also covers the open aggregator pass (Remotive,
      # The Muse) surfacing companies not on the direct list, auto-adding any
      # good match to companies.csv going forward (see slug_cache.json). Adding
      # a second, independent search: mkdir configs/<name>, copy
      # configs/default/config.json into it and edit it (give it its own
      # telegram.botTokenEnv/chatIdEnv names), add a matching pair of repo
      # secrets, and add another "Run scan" step below (or a matrix) with
      # --config=<name> and that config's env vars.
      - name: Run scan (default)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node job_watch.js --config=default --discover --quiet

      # hiring.cafe (a separate data source, hiring_cafe_scan.js) is NOT run
      # here anymore — as of 2026-09-02 hiringcafe.com put up a real
      # Cloudflare bot-challenge ("Just a moment...", cf-mitigated: challenge)
      # in front of the page this script reads to resolve its Next.js build
      # id. That's not fixable with headers/User-Agent (verified directly —
      # a realistic Chrome UA + full browser headers still gets challenged);
      # it needs a JS-executing browser, which this lightweight fetch-based
      # scanner doesn't have. hiring_cafe_scan.js itself is untouched (in
      # case the challenge is later relaxed) — just not scheduled. Re-enable
      # by adding back a step here: node hiring_cafe_scan.js --config=default --quiet
      # (env: TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID).

      # Second, independent search: configs/uk-design/config.json — Technical
      # Design / Retail Design roles (Kit Pethel), remote (or open-to-UK
      # remote elsewhere)/hybrid/onsite in London UK. Same bot as the default
      # search (TELEGRAM_BOT_TOKEN) but a different Telegram chat/channel
      # (TELEGRAM_CHAT_ID_UK_DESIGN), own state files under configs/uk-design/.
      #
      # NOTE: this profile has NO direct-ATS (job_watch.js) scan step here —
      # deliberately retired. That mechanism (a curated Greenhouse/Ashby/
      # Lever/Workday company list) skews heavily toward VC-funded US tech
      # companies and never surfaced a single genuinely UK-located match
      # (see configs/uk-design/companies.csv, kept on disk but no longer
      # scanned — a UK design/retail-industry search is much better served
      # by UK-market job-board APIs, see scan-uk-boards.yml). Its hiring.cafe
      # step is retired too, same reason/re-enable instructions as above
      # (node hiring_cafe_scan.js --config=uk-design --quiet, env:
      # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID_UK_DESIGN).

      # Pushes can be rejected if origin/main moved since checkout — e.g. a
      # manual push landing mid-run, or an overlapping run slipping past the
      # concurrency group. Retry with a merge favoring our just-computed
      # state (-X ours) on conflict: these are single-line cursor/cache
      # files, so a real conflict just means "two runs updated the same
      # timestamp" — ours is the fresher one, safe to keep unconditionally.
      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in configs/default/last_scan.json configs/default/slug_cache.json configs/default/companies.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update job scan state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) — remote moved, merging and retrying..."
            git fetch origin main
            git merge -X ours --no-edit origin/main
          done
          echo "Failed to push scan state after 5 attempts."
          exit 1
