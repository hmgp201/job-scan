name: Job scan

on:
  schedule:
    # GitHub Actions cron is best-effort and can lag a few minutes under load,
    # but this is the schedule requested: every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Never run two scans at once — they'd both read the same pre-scan ledger
# and could double-alert Telegram, and both would try to push state commits.
concurrency:
  group: job-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node job_watch.js --quiet

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_watch_log.csv run_counter.json slug_cache.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update job scan state [skip ci]"
            git push
          fi
