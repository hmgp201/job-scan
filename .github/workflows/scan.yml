name: Job scan

on:
  schedule:
    # GitHub Actions cron is best-effort and can lag a few minutes under load,
    # but this is the schedule requested: every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Never run two scans at once — they'd both read the same pre-scan ledger
# and could double-alert Telegram, and both would try to push state commits.
concurrency:
  group: job-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs configs/default/config.json, whose telegram.botTokenEnv/chatIdEnv
      # name TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID (see that file). This is a
      # one-shot notifier — it only sends Telegram messages, there's no
      # process left running to receive replies. --discover is always on here
      # so every scheduled run also covers the open aggregator pass (Remotive,
      # The Muse) surfacing companies not on the direct list, auto-adding any
      # good match to companies.csv going forward (see slug_cache.json). Adding
      # a second, independent search: mkdir configs/<name>, copy
      # configs/default/config.json into it and edit it (give it its own
      # telegram.botTokenEnv/chatIdEnv names), add a matching pair of repo
      # secrets, and add another "Run scan" step below (or a matrix) with
      # --config=<name> and that config's env vars.
      - name: Run scan (default)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node job_watch.js --config=default --discover --quiet

      # Separate data source (hiring.cafe, an AI-processed aggregator across
      # 46+ ATS platforms) — same config, own dedup cursor
      # (last_scan_hiringcafe.json), so it can't interfere with the scan
      # above. Uses the same shared minMatch floor; its synthetic
      # descriptions score lower on average but real matches still clear it
      # (verified 2026-08-30: 7/20 kept jobs passed minMatch=5, top score 12%).
      - name: Run scan (hiring.cafe)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node hiring_cafe_scan.js --config=default --quiet

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in configs/default/last_scan.json configs/default/slug_cache.json configs/default/companies.csv configs/default/last_scan_hiringcafe.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update job scan state [skip ci]"
            git push
          fi
